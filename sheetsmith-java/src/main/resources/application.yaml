spring:
  application:
    name: sheetsmith
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:ollama}

  # This app uses chat models and nothing else, but a provider starter also brings auto-configuration
  # for embeddings, images, moderation and audio — each of which insists on an API key at startup.
  # Turning them off here means a profile only has to say which chat provider it wants.
  ai:
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:xlsxai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema. `baseline-on-migrate` is what makes the switch safe for someone already
  # running this app: a database that Hibernate built is stamped as version 1 and starts at V2,
  # while an empty one gets V1 first.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: schema as ddl-auto left it

  jpa:
    hibernate:
      # validate, not update: a mapping that has drifted from the migrations now fails at startup
      # instead of quietly rewriting the user's database.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.ap0stole: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: WARN

# Renamed from `xlsxai` with the rest of the project. Every setting reads SHEETSMITH_* first and the
# old XLSXAI_* second, so an .env written before the rename still configures the instance it always
# did rather than silently reverting it to defaults.
sheetsmith:
  storage:
    upload-dir: ${SHEETSMITH_UPLOAD_DIR:${XLSXAI_UPLOAD_DIR:./uploads}}
    result-dir: ${SHEETSMITH_RESULT_DIR:${XLSXAI_RESULT_DIR:./results}}
    session-dir: ${SHEETSMITH_SESSION_DIR:${XLSXAI_SESSION_DIR:./sessions}}
    ttl-days: ${SHEETSMITH_TTL_DAYS:${XLSXAI_TTL_DAYS:7}}
  processing:
    max-concurrent-jobs: ${MAX_CONCURRENT_JOBS:1}
    max-autosize-cells: ${SHEETSMITH_MAX_AUTOSIZE_CELLS:${XLSXAI_MAX_AUTOSIZE_CELLS:500000}}
  security:
    allowed-origins: ${SHEETSMITH_ALLOWED_ORIGINS:${XLSXAI_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}}
    path-endpoint-enabled: ${SHEETSMITH_PATH_ENDPOINT_ENABLED:${XLSXAI_PATH_ENDPOINT_ENABLED:false}}
    path-endpoint-roots: ${SHEETSMITH_PATH_ENDPOINT_ROOTS:${XLSXAI_PATH_ENDPOINT_ROOTS:}}
  auth:
    # false — the default — is the solo case: no login screen, no owner on a run, no user list.
    # There is no XLSXAI_ fallback here because this setting never had an old name.
    enabled: ${SHEETSMITH_AUTH_ENABLED:false}
    # Short, because nothing can withdraw an access token early: this number is the whole
    # ceiling on how long a stolen one keeps working.
    access-token-ttl: ${SHEETSMITH_ACCESS_TOKEN_TTL:2h}
    refresh-token-ttl: ${SHEETSMITH_REFRESH_TOKEN_TTL:1d}
    remember-me-ttl: ${SHEETSMITH_REMEMBER_ME_TTL:30d}
    # Empty means the instance generates one and keeps it. Set this only when more than one
    # instance shares a database, since only then do they have to agree on tokens.
    jwt-secret: ${SHEETSMITH_JWT_SECRET:}
  chat:
    # false turns this into an improve-only instance: no chat, no data-grounded suggestions, and
    # nothing but the sheet's structure reaches the model.
    enabled: ${SHEETSMITH_CHAT_ENABLED:${XLSXAI_CHAT_ENABLED:true}}
    max-steps: ${SHEETSMITH_CHAT_MAX_STEPS:${XLSXAI_CHAT_MAX_STEPS:8}}
    max-cells: ${SHEETSMITH_CHAT_MAX_CELLS:${XLSXAI_CHAT_MAX_CELLS:300}}
    max-rows: ${SHEETSMITH_CHAT_MAX_ROWS:${XLSXAI_CHAT_MAX_ROWS:50}}
    history-messages: ${SHEETSMITH_CHAT_HISTORY:${XLSXAI_CHAT_HISTORY:12}}
    repair-steps: ${SHEETSMITH_CHAT_REPAIR_STEPS:${XLSXAI_CHAT_REPAIR_STEPS:2}}
    stream-timeout-ms: ${SHEETSMITH_CHAT_STREAM_TIMEOUT_MS:${XLSXAI_CHAT_STREAM_TIMEOUT_MS:600000}}
