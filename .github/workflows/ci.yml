name: CI

# Every push and every pull request. Until now the only thing running these tests was whoever
# happened to remember, which for a project taking outside contributions is the same as nothing:
# the first patch that breaks something would be found by a user rather than by a check.
on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run pointless. Cancel it rather than paying for
# it — except on the default branch, where every commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # The suite starts real PostgreSQL containers; on a cold cache that is most of the time.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Testcontainers needs a Docker daemon, and ubuntu-latest has one. That is the half of this
      # suite worth paying for: the tests that talk to real PostgreSQL are the ones that caught a
      # lower(bytea) failure and a lazy-loading bug that mocked repositories had happily passed.
      - name: Check Docker is available to Testcontainers
        run: docker version --format '{{.Server.Version}}'

      - name: Test
        working-directory: sheetsmith-java
        run: mvn -B -ntp test

      # Uploaded on failure only: a green run's reports are noise, a red one's are the first thing
      # anybody opens.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: sheetsmith-java/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 24, matching what the project is developed on. It said 20, and the frontend job died before
      # running a single test: jsdom 30 pulls an undici that calls webidl.util.markAsUncloneable,
      # which Node 20 does not have. Nothing was wrong with the code — the runner was simply older
      # than the machine the tests were written on, which is the first thing a CI is for.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sheetsmith-react/package-lock.json

      - name: Install
        working-directory: sheetsmith-react
        run: npm ci

      # Separate steps rather than one `npm run lint && npm test`, so a red build says which of the
      # two it was without anybody opening the log.
      - name: Lint
        working-directory: sheetsmith-react
        run: npm run lint

      - name: Test
        working-directory: sheetsmith-react
        run: npx vitest run

      # The UI has shipped broken before by building fine locally and not in a clean checkout.
      - name: Build
        working-directory: sheetsmith-react
        run: npm run build

  # Neither job above builds anything somebody would run. The tests pass against classes on a
  # classpath; the quick-start in the README is `docker compose up --build`, and the gap between
  # those two is where a dependency change hides. This closed after Spring Boot 4 landed with new
  # modules and moved artifacts: every test stayed green, and whether the image still built was
  # nobody's business until somebody tried it by hand.
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # The same command the README gives, from the repository root, because the UI is a sibling
      # directory the build has to reach. Not pushed anywhere — the question is whether it builds.
      - name: Build the image the quick-start builds
        run: docker build -f sheetsmith-java/Dockerfile -t sheetsmith:ci .

      # Building is not starting. This is the first thing a stranger sees, so it is worth a check
      # that the container comes up, serves the UI and answers the call the browser makes first.
      - name: Start it against a throwaway Postgres
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net             -e POSTGRES_DB=xlsxai -e POSTGRES_USER=xlsxai -e POSTGRES_PASSWORD=xlsxai_pass             postgres:16-alpine
          docker run -d --name ci-app --network ci-net -p 8080:8080             -e DB_HOST=ci-db -e DB_NAME=xlsxai -e DB_USERNAME=xlsxai -e DB_PASSWORD=xlsxai_pass             sheetsmith:ci

      - name: Wait for it to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/capabilities > /dev/null; then
              echo "up after ${i}0s at most"; exit 0
            fi
            sleep 10
          done
          echo "never came up"; docker logs ci-app | tail -50; exit 1

      - name: It serves the UI and its own API document
        run: |
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/v3/api-docs > /dev/null
          echo "index.html and /v3/api-docs both answered"

      - name: Logs, when it did not work
        if: failure()
        run: docker logs ci-app | tail -100
